name: SyncStock CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/launch-site-reliability

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PRISMA_URL: postgresql://syncstock:syncstock@127.0.0.1:5432/syncstock?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://syncstock:syncstock@127.0.0.1:5432/syncstock?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      NEXTAUTH_SECRET: ci-only-nextauth-secret-32-characters
      APP_URL: http://localhost:3000
      ENCRYPTION_KEY: ci-only-encryption-key-32-characters
      SHOPIFY_API_KEY: ci-shopify-key
      SHOPIFY_API_SECRET: ci-shopify-secret
      SHOPIFY_SCOPES: read_orders,read_products
      QBO_CLIENT_ID: ci-qbo-client
      QBO_CLIENT_SECRET: ci-qbo-secret
      QBO_ENVIRONMENT: sandbox
      STRIPE_SECRET_KEY: sk_test_syncstock_ci_only
      STRIPE_WEBHOOK_SECRET: whsec_syncstock_ci_only
      STRIPE_PRICE_STARTER: price_ci_starter
      STRIPE_PRICE_GROWTH: price_ci_growth
      STRIPE_PRICE_UNLIMITED: price_ci_unlimited

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Reconciliation smoke tests
        run: npm run test:reconciliation

      - name: Core security and quota smoke tests
        run: npm run test:core

      - name: Production build
        run: npm run build

      - name: Export generated package lock
        if: hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 1

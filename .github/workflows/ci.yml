name: SyncStock CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - fix/paid-launch-foundation
      - feature/launch-site-reliability
      - fix/shopify-public-billing

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: syncstock
          POSTGRES_PASSWORD: syncstock
          POSTGRES_DB: syncstock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U syncstock"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      POSTGRES_PRISMA_URL: postgresql://syncstock:syncstock@127.0.0.1:5432/syncstock?schema=public
      POSTGRES_URL_NON_POOLING: postgresql://syncstock:syncstock@127.0.0.1:5432/syncstock?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      NEXTAUTH_SECRET: ci-only-nextauth-secret-32-characters
      APP_URL: http://localhost:3000
      ENCRYPTION_KEY: ci-only-encryption-key-32-characters
      SHOPIFY_API_KEY: ci-shopify-key
      SHOPIFY_API_SECRET: ci-shopify-secret
      SHOPIFY_SCOPES: read_orders,read_products
      QBO_CLIENT_ID: ci-qbo-client
      QBO_CLIENT_SECRET: ci-qbo-secret
      QBO_ENVIRONMENT: sandbox
      STRIPE_SECRET_KEY: sk_test_syncstock_ci_only
      STRIPE_WEBHOOK_SECRET: whsec_syncstock_ci_only
      STRIPE_PRICE_STARTER: price_ci_starter
      STRIPE_PRICE_GROWTH: price_ci_growth
      STRIPE_PRICE_UNLIMITED: price_ci_unlimited

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Runtime critical dependency audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Create Supabase roles for migration checks
        env:
          PGPASSWORD: syncstock
        run: |
          psql -h 127.0.0.1 -U syncstock -d syncstock -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          SQL

      - name: Migrate an empty database
        run: npm run prisma:deploy

      - name: Check migrated database matches schema
        run: npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Verify Data API roles have no app-table privileges
        env:
          PGPASSWORD: syncstock
        shell: bash
        run: |
          forbidden_grants="$(psql -h 127.0.0.1 -U syncstock -d syncstock -At -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM information_schema.role_table_grants WHERE grantee IN ('anon','authenticated') AND table_schema = 'public';")"
          echo "anon/authenticated public-table grants: $forbidden_grants"
          test "$forbidden_grants" = "0"

      - name: Expansion offline safety and acceptance tests
        run: npm run test:expansion

      - name: Expansion consent database concurrency and isolation
        env:
          SYNCSTOCK_EXPANSION_TEST_DATABASE_URL: postgresql://syncstock:syncstock@127.0.0.1:5432/syncstock?schema=public
        run: node --import tsx scripts/expansion-consent-store-db-smoke.ts

      - name: Expansion encrypted token storage and refresh concurrency
        env:
          SYNCSTOCK_EXPANSION_TEST_DATABASE_URL: postgresql://syncstock:syncstock@127.0.0.1:5432/syncstock?schema=public
        run: node --import tsx scripts/expansion-token-store-db-smoke.ts

      - name: Expansion provider-account binding and tenant isolation
        env:
          SYNCSTOCK_EXPANSION_TEST_DATABASE_URL: postgresql://syncstock:syncstock@127.0.0.1:5432/syncstock?schema=public
        run: node --import tsx scripts/expansion-account-binding-db-smoke.ts

      - name: Expansion shared route protection
        env:
          SYNCSTOCK_EXPANSION_TEST_DATABASE_URL: postgresql://syncstock:syncstock@127.0.0.1:5432/syncstock?schema=public
        run: |
          node --import tsx scripts/expansion-route-limit-adapter-smoke.ts
          node --import tsx scripts/expansion-route-limit-db-smoke.ts

      - name: Reconciliation smoke tests
        run: npm run test:reconciliation

      - name: Core security and quota smoke tests
        run: npm run test:core

      - name: Billing event ordering and concurrency
        run: npm run test:billing

      - name: Shopify App Pricing catalog mapping
        run: npm run test:shopify-billing

      - name: Shopify reinstall pricing access and sync readiness
        run: npm run test:shopify-pricing-access

      - name: Shopify embedded ID token validation
        run: npm run test:shopify-auth

      - name: Shopify webhook and OAuth signature verification
        run: npm run test:shopify-signatures

      - name: Shopify App Store webhook contract
        run: npx tsx scripts/shopify-app-review-webhooks-smoke.ts

      - name: Shopify reinstall account and token regression
        run: node --import tsx scripts/shopify-reinstall-smoke.ts

      - name: Shopify shop redaction database regression
        env:
          SYNCSTOCK_REDACTION_TEST_DATABASE_URL: postgresql://syncstock:syncstock@127.0.0.1:5432/syncstock?schema=public
        run: npm run test:shop-redaction

      - name: Shopify API error payload normalization
        run: npm run test:shopify-errors

      - name: Embedded mapping removal regression
        run: npx tsx scripts/mapping-selection-smoke.ts

      - name: Launch surface regression
        run: npm run test:launch-surface

      - name: QuickBooks reconnect regression
        run: npm run test:qbo-reconnect

      - name: Embedded retry regression
        run: npm run test:embedded-retry

      - name: Embedded sync recovery UX
        run: npm run test:embedded-sync-recovery

      - name: Durable queue recovery
        run: npm run test:queue-recovery

      - name: Production build
        run: npm run build

      - name: Public HTTP route smoke
        shell: bash
        run: |
          npm run start > /tmp/syncstock-next.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          for route in / /signup /login /privacy /terms /support /docs /tools/bookkeeping-cost /app /robots.txt /sitemap.xml /settings/connections; do
            echo "Checking $route"
            curl --fail --silent --show-error "http://127.0.0.1:3000$route" > /dev/null
          done
          # Expansion is off by default. These checks must not contact a provider
          # or query token/consent storage, even with malformed/missing auth.
          for endpoint in \
            'POST /api/expansion/oauth/xero/start' \
            'POST /api/expansion/oauth/ebay/start' \
            'GET /api/expansion/oauth/xero/callback' \
            'GET /api/expansion/connections/11111111-1111-4111-8111-111111111111' \
            'GET /api/expansion/connections/11111111-1111-4111-8111-111111111111/accounts' \
            'POST /api/expansion/connections/11111111-1111-4111-8111-111111111111/bind'; do
            read -r method route <<< "$endpoint"
            status="$(curl --silent --show-error -X "$method" -D /tmp/expansion-headers -o /tmp/expansion-body -w '%{http_code}' "http://127.0.0.1:3000$route")"
            test "$status" = "404"
            grep -qi 'cache-control: no-store' /tmp/expansion-headers
            grep -q '"error":"not_found"' /tmp/expansion-body
          done

      - name: Export generated package lock
        if: hashFiles('package-lock.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 1

name: Deploy Shopify app configuration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/shopify-deploy.yml
      - shopify.app.toml

permissions:
  contents: read

concurrency:
  group: shopify-app-config-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Release Shopify app version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install latest Shopify CLI
        run: npm install --global @shopify/cli@latest

      - name: Verify automation token is configured
        shell: bash
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
        run: |
          if [ -z "$SHOPIFY_APP_AUTOMATION_TOKEN" ]; then
            echo "::error::Repository secret SHOPIFY_APP_AUTOMATION_TOKEN is not configured."
            exit 1
          fi

      - name: Deploy and release canonical Shopify configuration
        env:
          SHOPIFY_APP_AUTOMATION_TOKEN: ${{ secrets.SHOPIFY_APP_AUTOMATION_TOKEN }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          shopify app deploy \
            --allow-updates \
            --client-id 6ad1f2ea53500a6202c9a046f6be56df \
            --message "Release mandatory compliance webhooks and canonical SyncStock configuration" \
            --source-control-url "$COMMIT_URL"
